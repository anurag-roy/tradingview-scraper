# Template only: npm run login:proxy writes the configured, private copy in .auth/.
# Use --http-only before the certificate exists. Install the complete version after issuance.
server {
    listen 80;
    server_name __LOGIN_HOST__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tradingview-acme;
        try_files $uri =404;
    }

    location / {
        return 301 __LOGIN_ORIGIN__$request_uri;
    }
}

# HTTPS configuration
map $http_upgrade $tradingview_connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=tradingview_portal:10m rate=5r/s;

server {
    listen 443 ssl;
    server_name __LOGIN_HOST__;
    ssl_certificate /etc/letsencrypt/live/tradingview-login/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tradingview-login/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1k;
    # Avoid recording the remote desktop's query strings in access logs.
    access_log off;

    # Protect static files as well as requests forwarded to the app.
    auth_basic "TradingView login portal";
    auth_basic_user_file /etc/nginx/tradingview-login.htpasswd;
    limit_req zone=tradingview_portal burst=100 nodelay;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # Replace client-supplied identity headers only after password authentication.
    proxy_set_header X-Login-User $remote_user;
    proxy_set_header X-Login-Proxy-Token "__LOGIN_PROXY_TOKEN__";
    proxy_set_header Authorization "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $tradingview_connection_upgrade;
    proxy_read_timeout 3700s;
    proxy_send_timeout 30s;
    proxy_buffering off;

    # Serve noVNC's module tree without using websockify's HTTP server.
    location /desktop/ {
        alias /usr/share/novnc/;
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        autoindex off;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # Exact match wins over the static directory; the app still gates upgrades.
    location = /desktop/websockify {
        proxy_pass http://127.0.0.1:__LOGIN_PORT__;
    }

    location / {
        proxy_pass http://127.0.0.1:__LOGIN_PORT__;
    }
}
